[language-server.rust-analyzer.config.check]
command = "clippy"

[language-server.ty]
command = "ty-wrapper"
args = ["server"]

[[language]]
name = "python"
auto-format = true
# `ruff format` alone leaves every lint fix on the table — unsorted imports
# (I001) and unused ones (F401) survive the save and the LSP keeps flagging
# them. ruff-fmt runs `check --fix-only` first, then formats.
formatter = { command = "ruff-fmt", args = ["%{buffer_name}"] }


[[language]]
name = "xml"
auto-format = true
formatter = { command = "xmllint", args = ["--format", "-"] }
